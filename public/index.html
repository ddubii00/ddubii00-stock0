<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ddubii-stock0</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="날짜와 요약">
        <div class="brand">
          <div class="brand-mark">D</div>
          <div>
            <h1>ddubii-stock0</h1>
            <p>daily investor routine</p>
          </div>
        </div>

        <section class="side-panel">
          <label for="date-input">기록 날짜</label>
          <div class="date-row">
            <input id="date-input" type="date">
            <button id="today-button" type="button" title="오늘로 이동">◎</button>
          </div>
        </section>

        <section class="score-panel">
          <div class="score-ring" id="score-ring">
            <strong id="score-percent">0%</strong>
            <span>완료율</span>
          </div>
          <div class="score-meta">
            <div>
              <span>완료</span>
              <strong id="done-count">0/0</strong>
            </div>
            <div>
              <span>연속</span>
              <strong id="streak-count">0일</strong>
            </div>
          </div>
        </section>

        <section class="side-panel">
          <div class="section-heading">
            <h2>최근 7일</h2>
          </div>
          <div class="week-list" id="week-list"></div>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Routine check</p>
            <h2 id="page-title">오늘의 투자 루틴</h2>
          </div>
          <div class="top-actions">
            <span class="sync-state" id="sync-state">로컬 저장</span>
            <button id="sync-button" type="button">동기화</button>
            <button id="export-button" type="button" title="Excel 문서 저장">Excel 저장</button>
            <button id="reset-day-button" type="button">오늘 기록 초기화</button>
          </div>
        </header>

        <section class="status-strip" aria-live="polite">
          <div>
            <span>마음가짐</span>
            <strong id="mindset-status">0/0</strong>
          </div>
          <div>
            <span>뉴스/자료</span>
            <strong id="news-status">0/0</strong>
          </div>
          <div>
            <span>시장/차트</span>
            <strong id="market-status">0/0</strong>
          </div>
          <div>
            <span>보유/편입</span>
            <strong id="holdings-status">0/0</strong>
          </div>
          <div>
            <span>신규 발굴</span>
            <strong id="discovery-status">0/0</strong>
          </div>
        </section>

        <section class="content-grid">
          <div class="routine-panel">
            <div class="panel-head">
              <div>
                <h3>체크리스트</h3>
                <p id="completion-line">루틴을 점검합니다.</p>
              </div>
              <button id="complete-all-button" type="button">전체 완료</button>
            </div>
            <div class="routine-list" id="routine-list"></div>
          </div>

          <aside class="journal-panel" aria-label="투자 로그">
            <div class="panel-head">
              <div>
                <h3>투자 로그</h3>
                <p id="save-state">자동 저장</p>
              </div>
            </div>

            <label for="market-note">오늘 핵심 메모</label>
            <textarea id="market-note" data-note="market" placeholder="오늘 확인한 핵심 내용"></textarea>

            <label for="trade-note">못 한 이유</label>
            <textarea id="trade-note" data-note="trade" placeholder="못 한 항목이 있다면 이유를 적어두세요."></textarea>

            <label for="tomorrow-note">내일 보완할 것</label>
            <textarea id="tomorrow-note" data-note="tomorrow" placeholder="내일 먼저 확인하거나 보완할 내용"></textarea>
          </aside>
        </section>

        <section class="editor-panel">
          <div class="panel-head">
            <div>
              <h3>루틴 편집</h3>
              <p>나에게 맞는 투자 습관으로 조정합니다.</p>
            </div>
            <button id="restore-button" type="button">기본값 복원</button>
          </div>

          <form class="add-form" id="add-form">
            <select id="category-select" aria-label="카테고리">
              <option value="mindset">마음가짐</option>
              <option value="news">뉴스/자료</option>
              <option value="market">시장/차트</option>
              <option value="holdings">보유/편입</option>
              <option value="discovery">신규 발굴</option>
            </select>
            <input id="task-input" type="text" maxlength="80" placeholder="새 루틴 항목">
            <button type="submit">추가</button>
          </form>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
